<div>
    <table>
      <thead>
        <tr>
          <td>UserId</td>
          <td>Name</td>
          <td>Email</td>
          <td>Phone</td>
          <td>Delete</td>
          <td>Edit</td>
        </tr>
      </thead>
      <tbody>
        @for (data of details; track $index) {
          <tr>
            <td>{{ $index + 1 }}</td>
            <td>{{ data.name }}</td>
            <td>{{ data.email }}</td>
            <td>{{ data.phone }}</td>
            <td>
              <button class="btn-delete" (click)="delete($index)" [disabled]="$index === activeEditIndex">
                Delete
              </button>
            </td>
            <td>
              <button class="btn-edit" (click)="edit($index)" [disabled]="$index === activeEditIndex">
                {{ $index === activeEditIndex ? 'Edit' : 'Edit' }}
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>

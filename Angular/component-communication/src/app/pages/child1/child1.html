<div class="card">
    <h3>{{ editIndex !== null ? 'Editing Row #' + (editIndex + 1) : 'Add User' }}</h3>
  
    <div class="field">
      <label>Name</label>
      <input type="text" [(ngModel)]="name" name="name" placeholder="Enter name">
    </div>
  
    <div class="field">
      <label>Email</label>
      <input type="text" [(ngModel)]="email" name="email" placeholder="Enter email">
    </div>
  
    <div class="field">
      <label>Phone</label>
      <input type="text" [(ngModel)]="phone" name="phone" placeholder="Enter number">
    </div>
  
    <button type="button" (click)="saveData()">
      {{ editIndex === null ? 'Add' : 'Edituser' }}
    </button>
  </div>

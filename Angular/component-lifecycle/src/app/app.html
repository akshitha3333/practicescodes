<div class="row mt-5">
  <div class="col-4"></div>
  <div class="col-4">
    <input type="text" class="form-control"[(ngModel)]="data">
  </div>
  <div class="col-4 p-3">
    <div class="row g-5">
          <div>Result</div>
          <div><input type="radio" name="result" [(ngModel)]="result1" value="result1" id="result1">&nbsp;<label for="result1">Result 1</label></div>
          <div><input type="radio" name="result" [(ngModel)]="result2"  value="result2" id="result2">&nbsp;<label for="result2">Result 2</label></div>
    </div>
  </div>
</div>
@if(result ==="result1"){
  <app-result-one [data]="data"></app-result-one>
}@else{
  <app-result-two></app-result-two>
}
